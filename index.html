<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo Vivo - Sistema de Gestión</title>
    
    <!-- Librerías desde CDN (No requiere instalación) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ICONOS SVG ---
        const Icons = {
            Bag: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Package: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22v-9"/></svg>,
            File: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Dollar: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Alert: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>,
            Dashboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            Chart: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        };

        // --- DATOS INICIALES ---
        const INITIAL_PRODUCTS = [
            { id: 101, name: "Sofá Velvet Azul", category: "Muebles", price: 450000, cost: 280000, stock: 4, status: "Activo" },
            { id: 102, name: "Lámpara Industrial", category: "Iluminación", price: 85000, cost: 45000, stock: 12, status: "Activo" },
            { id: 103, name: "Cojín Lino Beige", category: "Textiles", price: 25000, cost: 12000, stock: 50, status: "Activo" },
            { id: 104, name: "Espejo Redondo", category: "Accesorios", price: 60000, cost: 35000, stock: 0, status: "Sin Stock" },
        ];

        const INITIAL_FINANCE = [
            { id: 1, type: "Ingreso", concept: "Venta Mayorista", amount: 1500000, date: "2023-10-20" },
            { id: 2, type: "Gasto", concept: "Pago Proveedor Telas", amount: -400000, date: "2023-10-21" },
            { id: 3, type: "Retiro", concept: "Retiro Personal Dueño (No Gasto)", amount: -100000, date: "2023-10-22" },
        ];

        const CREDENTIALS = {
            admin: { pass: 'admin123', label: 'Dueño / Admin' },
            accountant: { pass: 'conta123', label: 'Contador Auditor' },
            inventory: { pass: 'bodega123', label: 'Jefe de Bodega' }
        };

        function EstiloVivoApp() {
            const [currentUser, setCurrentUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [finances, setFinances] = useState(INITIAL_FINANCE);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [newProduct, setNewProduct] = useState({ name: '', category: 'Muebles', price: '', cost: '', stock: '' });
            const [selectedRoleForLogin, setSelectedRoleForLogin] = useState(null);
            const [passwordInput, setPasswordInput] = useState('');
            const [loginError, setLoginError] = useState('');

            // Handlers
            const handleLoginSubmit = (e) => {
                e.preventDefault();
                const roleKey = selectedRoleForLogin;
                if (passwordInput !== CREDENTIALS[roleKey].pass) {
                    setLoginError('Clave incorrecta para este perfil.');
                    return;
                }
                setLoginError('');
                setPasswordInput(''); 
                setSelectedRoleForLogin(null);
                setCurrentUser({
                    name: CREDENTIALS[roleKey].label,
                    role: roleKey,
                    permissions: roleKey === 'admin' ? ['all'] : roleKey === 'accountant' ? ['finance', 'tax'] : ['inventory']
                });
                setCurrentView(roleKey === 'inventory' ? 'inventory' : 'dashboard');
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setCurrentView('dashboard');
                setSelectedProduct(null);
                setLoginError('');
                setPasswordInput('');
                setSelectedRoleForLogin(null);
            };

            const handleAddProduct = (e) => {
                e.preventDefault();
                const product = {
                    id: Date.now(),
                    ...newProduct,
                    price: Number(newProduct.price),
                    cost: Number(newProduct.cost),
                    stock: Number(newProduct.stock),
                    status: Number(newProduct.stock) > 0 ? "Activo" : "Sin Stock"
                };
                setProducts([...products, product]);
                setNewProduct({ name: '', category: 'Muebles', price: '', cost: '', stock: '' });
                alert("Producto agregado correctamente al sistema contable.");
            };

            const totalStockValue = products.reduce((acc, curr) => acc + (curr.cost * curr.stock), 0);
            const totalSalesPotential = products.reduce((acc, curr) => acc + (curr.price * curr.stock), 0);
            const estimatedTax = totalSalesPotential * 0.19;

            // --- PANTALLAS ---

            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-stone-100 flex items-center justify-center p-4 font-sans">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-8 border-teal-600 transition-all">
                            <div className="text-center mb-6">
                                <div className="flex justify-center mb-4">
                                    <div className="bg-teal-600 p-3 rounded-full text-white inline-block">
                                        <Icons.Bag />
                                    </div>
                                </div>
                                <h1 className="text-3xl font-bold text-stone-800">Estilo Vivo</h1>
                                <p className="text-stone-500 mt-2">Sistema de Gestión Integral</p>
                            </div>
                            
                            {!selectedRoleForLogin && (
                                <div className="space-y-4 animate-fade-in">
                                    <p className="text-sm text-center text-stone-400 mb-4">¿Quién está ingresando hoy?</p>
                                    {[
                                        {key: 'admin', icon: Icons.User, label: 'Dueño / Admin', desc: 'Acceso Total', color: 'teal'},
                                        {key: 'accountant', icon: Icons.File, label: 'Contador', desc: 'Finanzas y Tributario', color: 'blue'},
                                        {key: 'inventory', icon: Icons.Package, label: 'Bodeguero', desc: 'Inventario', color: 'amber'}
                                    ].map(role => (
                                        <button key={role.key} onClick={() => { setSelectedRoleForLogin(role.key); setLoginError(''); }} className={`w-full flex items-center p-4 bg-white border border-stone-200 rounded-xl hover:bg-${role.color}-50 hover:border-${role.color}-500 transition-all shadow-sm group`}>
                                            <div className={`bg-stone-100 p-2 rounded-lg group-hover:bg-${role.color}-200 transition-colors`}>
                                                <role.icon className={`w-5 h-5 text-stone-600 group-hover:text-${role.color}-800`} />
                                            </div>
                                            <div className="ml-4 text-left">
                                                <span className="block font-semibold text-stone-700">{role.label}</span>
                                                <span className="text-xs text-stone-500">{role.desc}</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            )}

                            {selectedRoleForLogin && (
                                <div className="animate-fade-in">
                                    <button onClick={() => { setSelectedRoleForLogin(null); setPasswordInput(''); setLoginError(''); }} className="flex items-center text-sm text-stone-400 hover:text-stone-600 mb-4 transition-colors">
                                        <div className="w-4 h-4 mr-1 inline-block"><Icons.ArrowLeft /></div> Volver
                                    </button>
                                    <div className="text-center mb-6">
                                       <span className="bg-stone-100 text-stone-600 px-4 py-1 rounded-full text-sm font-bold">{CREDENTIALS[selectedRoleForLogin].label}</span>
                                    </div>
                                    <form onSubmit={handleLoginSubmit}>
                                        <div className="mb-6">
                                            <label className="block text-sm font-medium text-stone-600 mb-2 flex items-center gap-2 justify-center">
                                                <div className="w-4 h-4 text-teal-600 inline-block"><Icons.Lock /></div> Ingrese su clave:
                                            </label>
                                            <input type="password" autoFocus value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="••••••••" className="w-full p-3 text-center text-lg tracking-widest border border-stone-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition-shadow" />
                                            <div className="mt-3 text-xs text-center text-stone-400 bg-stone-50 p-2 rounded border border-stone-200">
                                                <p>Clave Demo: <strong>{CREDENTIALS[selectedRoleForLogin].pass}</strong></p>
                                            </div>
                                            {loginError && <div className="mt-3 p-2 bg-red-50 border border-red-100 rounded text-red-600 text-xs font-bold flex items-center justify-center animate-pulse">{loginError}</div>}
                                        </div>
                                        <button type="submit" className="w-full bg-teal-600 text-white p-3 rounded-xl font-bold hover:bg-teal-700 transition-all transform active:scale-95 shadow-lg flex justify-center items-center gap-2">
                                            Ingresar <div className="w-5 h-5 inline-block"><Icons.Check /></div>
                                        </button>
                                    </form>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-stone-50 flex flex-col md:flex-row font-sans">
                    <aside className="w-full md:w-64 bg-stone-900 text-stone-300 flex flex-col">
                        <div className="p-6 border-b border-stone-800">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                <div className="text-teal-500 w-6 h-6 inline-block"><Icons.Bag /></div> Estilo Vivo
                            </h1>
                            <p className="text-xs mt-2 text-stone-500">Usuario: <span className="text-stone-300">{currentUser.name}</span></p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setCurrentView('dashboard')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${currentView === 'dashboard' ? 'bg-teal-600 text-white' : 'hover:bg-stone-800'}`}>
                                <div className="w-5 h-5 mr-3 inline-block"><Icons.Dashboard /></div> Panel General
                            </button>
                            <button onClick={() => setCurrentView('inventory')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${currentView === 'inventory' ? 'bg-teal-600 text-white' : 'hover:bg-stone-800'}`}>
                                <div className="w-5 h-5 mr-3 inline-block"><Icons.Package /></div> Productos
                            </button>
                            {(currentUser.role === 'admin' || currentUser.role === 'accountant') && (
                                <>
                                    <button onClick={() => setCurrentView('finance')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${currentView === 'finance' ? 'bg-teal-600 text-white' : 'hover:bg-stone-800'}`}>
                                        <div className="w-5 h-5 mr-3 inline-block"><Icons.Dollar /></div> Finanzas
                                    </button>
                                    <button onClick={() => setCurrentView('tax')} className={`w-full flex items-center p-3 rounded-lg transition-colors ${currentView === 'tax' ? 'bg-teal-600 text-white' : 'hover:bg-stone-800'}`}>
                                        <div className="w-5 h-5 mr-3 inline-block"><Icons.File /></div> Tributario
                                    </button>
                                </>
                            )}
                        </nav>
                        <div className="p-4 border-t border-stone-800">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center p-2 text-stone-400 hover:text-red-400 transition-colors">
                                <div className="w-4 h-4 mr-2 inline-block"><Icons.LogOut /></div> Cerrar Sesión
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 p-8 overflow-y-auto">
                        <header className="mb-8 flex justify-between items-center">
                            <div>
                                <h2 className="text-2xl font-bold text-stone-800 capitalize">
                                    {currentView === 'dashboard' && 'Visión General'}
                                    {currentView === 'inventory' && 'Gestión de Inventario'}
                                    {currentView === 'finance' && 'Control Financiero'}
                                    {currentView === 'tax' && 'Documentos y SSI'}
                                </h2>
                                <p className="text-stone-500 text-sm">Administración y control para tienda retail.</p>
                            </div>
                        </header>

                        {currentView === 'dashboard' && (
                             <div className="space-y-6 animate-fade-in">
                                <div className="p-4 bg-red-50 border border-red-200 rounded-lg flex items-center gap-3">
                                    <div className="text-red-500 w-6 h-6 inline-block"><Icons.Alert /></div>
                                    <p className="text-red-700 text-sm"><strong>Alerta de Gestión:</strong> Se detectaron 2 transacciones personales mezcladas con fondos de la empresa.</p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-100">
                                        <div className="flex justify-between items-center mb-4"><h3 className="text-stone-500 font-medium">Valor Inventario (Costo)</h3><div className="text-teal-600 w-5 h-5 inline-block"><Icons.Package /></div></div>
                                        <p className="text-3xl font-bold text-stone-800">${totalStockValue.toLocaleString('es-CL')}</p>
                                        <p className="text-xs text-teal-600 mt-2 flex items-center"><div className="w-3 h-3 mr-1 inline-block"><Icons.Chart /></div> Activo Corriente Real</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-100">
                                        <div className="flex justify-between items-center mb-4"><h3 className="text-stone-500 font-medium">Provisión IVA</h3><div className="text-blue-600 w-5 h-5 inline-block"><Icons.File /></div></div>
                                        <p className="text-3xl font-bold text-stone-800">${estimatedTax.toLocaleString('es-CL')}</p>
                                        <p className="text-xs text-stone-400 mt-2">Basado en stock actual</p>
                                    </div>
                                    <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-100">
                                        <div className="flex justify-between items-center mb-4"><h3 className="text-stone-500 font-medium">Flujo de Caja Real</h3><div className="text-amber-600 w-5 h-5 inline-block"><Icons.Dollar /></div></div>
                                        <p className="text-3xl font-bold text-stone-800">$1.100.000</p>
                                        <p className="text-xs text-red-500 mt-2">Excluyendo retiros personales</p>
                                    </div>
                                </div>
                             </div>
                        )}

                        {currentView === 'inventory' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-stone-800">Módulo Principal: Productos</h2>
                                    <span className="bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-xs font-semibold">Base de Datos Centralizada</span>
                                </div>
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                                    <h3 className="text-lg font-semibold mb-4 text-stone-700 flex items-center"><div className="w-5 h-5 mr-2 inline-block"><Icons.Plus /></div> Ingreso de Nuevo Producto</h3>
                                    <form onSubmit={handleAddProduct} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-medium text-stone-500 mb-1">Nombre Producto</label>
                                            <input required type="text" placeholder="Ej: Lámpara de Pie" className="w-full p-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-stone-500 mb-1">Categoría</label>
                                            <select className="w-full p-2 border border-stone-300 rounded-lg" value={newProduct.category} onChange={e => setNewProduct({...newProduct, category: e.target.value})}>
                                                <option>Muebles</option><option>Iluminación</option><option>Textiles</option><option>Accesorios</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-stone-500 mb-1">Precio Venta</label>
                                            <input required type="number" placeholder="$" className="w-full p-2 border border-stone-300 rounded-lg" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-stone-500 mb-1">Stock</label>
                                            <div className="flex gap-2">
                                                <input required type="number" placeholder="Cant." className="w-full p-2 border border-stone-300 rounded-lg" value={newProduct.stock} onChange={e => setNewProduct({...newProduct, stock: e.target.value})} />
                                                <button type="submit" className="bg-teal-600 text-white p-2 rounded-lg hover:bg-teal-700"><div className="w-5 h-5 inline-block"><Icons.Plus /></div></button>
                                            </div>
                                        </div>
                                        <input type="hidden" value={newProduct.cost} onChange={e => setNewProduct({...newProduct, cost: e.target.value})} />
                                    </form>
                                </div>
                                <div className="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                                    <table className="w-full text-left text-sm text-stone-600">
                                        <thead className="bg-stone-50 text-stone-700 uppercase font-semibold">
                                            <tr><th className="p-4">Producto</th><th className="p-4">Categoría</th><th className="p-4">Precio</th><th className="p-4">Stock</th><th className="p-4 text-center">Acción</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-stone-100">
                                            {products.map((product) => (
                                                <tr key={product.id} className="hover:bg-stone-50 transition-colors">
                                                    <td className="p-4 font-medium text-stone-800">{product.name}</td>
                                                    <td className="p-4"><span className="bg-stone-100 px-2 py-1 rounded text-xs">{product.category}</span></td>
                                                    <td className="p-4">${product.price.toLocaleString('es-CL')}</td>
                                                    <td className="p-4"><span className={`${product.stock < 5 ? 'text-red-500 font-bold' : 'text-green-600'}`}>{product.stock} un.</span></td>
                                                    <td className="p-4 text-center">
                                                        <button onClick={() => setSelectedProduct(product)} className="text-teal-600 hover:text-teal-800 hover:bg-teal-50 p-2 rounded-full transition-colors"><div className="w-5 h-5 inline-block"><Icons.Eye /></div></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {currentView === 'finance' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold text-stone-800">Interfaz: Finanzas</h2><div className="bg-amber-100 text-amber-800 px-4 py-2 rounded-lg text-xs font-bold border border-amber-200">OBJETIVO: Separar Cuentas</div></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-xl border border-stone-200">
                                        <h3 className="font-semibold mb-4 text-stone-700">Movimientos</h3>
                                        <ul className="space-y-3">
                                            {finances.map((f) => (
                                                <li key={f.id} className="flex justify-between items-center p-3 bg-stone-50 rounded-lg border-l-4 border-l-transparent hover:border-l-stone-400 transition-all">
                                                    <div><p className="font-medium text-stone-800">{f.concept}</p><p className="text-xs text-stone-500">{f.date} • {f.type}</p></div>
                                                    <span className={`font-mono font-bold ${f.amount > 0 ? 'text-green-600' : f.type === 'Retiro' ? 'text-amber-600' : 'text-red-600'}`}>{f.amount > 0 ? '+' : ''} ${Math.abs(f.amount).toLocaleString('es-CL')}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                    <div className="bg-teal-50 p-6 rounded-xl border border-teal-100">
                                        <h3 className="font-semibold mb-2 text-teal-800">Diagnóstico</h3>
                                        <p className="text-sm text-teal-700 mb-4">Capital inmovilizado en stock: <strong>${totalStockValue.toLocaleString()}</strong>. Limitar retiros personales al 10%.</p>
                                        <div className="h-2 bg-white rounded-full overflow-hidden"><div className="h-full bg-teal-500 w-3/4"></div></div>
                                        <p className="text-xs text-right mt-1 text-teal-600">Salud Financiera: 75%</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentView === 'tax' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-stone-800">Interfaz: Tributario (SSI)</h2>
                                <div className="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
                                    <h3 className="font-semibold text-stone-800 mb-4">Planificación Fiscal</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-stone-500 uppercase bg-stone-50"><tr><th className="px-4 py-3">Concepto</th><th className="px-4 py-3">Base</th><th className="px-4 py-3">Estimado</th><th className="px-4 py-3">Estado</th></tr></thead>
                                            <tbody>
                                                <tr className="border-b border-stone-100"><td className="px-4 py-3 font-medium">IVA Débito</td><td className="px-4 py-3">${totalSalesPotential.toLocaleString()}</td><td className="px-4 py-3 text-red-600">${(totalSalesPotential * 0.19).toLocaleString()}</td><td className="px-4 py-3"><span className="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs">Pendiente</span></td></tr>
                                                <tr className="border-b border-stone-100"><td className="px-4 py-3 font-medium">PPM (1.5%)</td><td className="px-4 py-3">${totalSalesPotential.toLocaleString()}</td><td className="px-4 py-3 text-red-600">${(totalSalesPotential * 0.015).toLocaleString()}</td><td className="px-4 py-3"><span className="bg-red-100 text-red-800 px-2 py-0.5 rounded text-xs">Pendiente</span></td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedProduct && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50 animate-fade-in">
                                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                                    <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 text-stone-400 hover:text-stone-600"><div className="w-6 h-6 rotate-45 inline-block"><Icons.Plus /></div></button>
                                    <h2 className="text-2xl font-bold text-stone-800 mb-1">{selectedProduct.name}</h2>
                                    <span className="bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-xs font-bold uppercase">{selectedProduct.category}</span>
                                    <div className="mt-6 grid grid-cols-2 gap-4">
                                        <div className="p-4 bg-stone-50 rounded-lg"><p className="text-xs text-stone-500 uppercase">Precio</p><p className="text-xl font-bold text-stone-800">${selectedProduct.price.toLocaleString()}</p></div>
                                        <div className="p-4 bg-stone-50 rounded-lg"><p className="text-xs text-stone-500 uppercase">Costo</p><p className="text-xl font-bold text-stone-600">${selectedProduct.cost.toLocaleString()}</p></div>
                                        <div className="p-4 bg-stone-50 rounded-lg col-span-2 flex justify-between items-center"><div><p className="text-xs text-stone-500 uppercase">Stock</p><p className="text-xl font-bold text-stone-800">{selectedProduct.stock} unidades</p></div><div className={`w-3 h-3 rounded-full ${selectedProduct.stock > 0 ? 'bg-green-500' : 'bg-red-500'}`}></div></div>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EstiloVivoApp />);
    </script>
</body>
</html>
